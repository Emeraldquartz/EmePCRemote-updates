<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eme PC Remote</title>
<style>
:root{color-scheme:dark;--panel:#0d1b2d;--panel2:#10243b;--text:#eef7ff;--muted:#8fa8c0;--danger:#ff5f6d;--ok:#45d483}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#06101b,#091827 60%,#07111f);color:var(--text);min-height:100vh}
main{max-width:540px;margin:auto;padding:28px 18px 40px}
h1{font-size:28px;margin:0 0 6px}.sub{color:var(--muted);margin-bottom:20px}
.status,.panel{background:var(--panel);border:1px solid #1b3550;border-radius:18px;padding:14px 16px;margin-bottom:18px}
.status{display:flex;align-items:center;gap:10px}.dot{width:12px;height:12px;border-radius:50%;background:#6b7280}.dot.on{background:var(--ok);box-shadow:0 0 18px #45d48388}
.grid,.apps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{appearance:none;border:0;border-radius:18px;padding:18px 12px;font-size:16px;font-weight:700;background:var(--panel2);color:var(--text);border:1px solid #1d3b5a;min-height:68px}
button:active{transform:scale(.985)}button.danger{background:#30161c;border-color:#6d2a37}button[disabled]{opacity:.45}
.full{grid-column:1/-1}.small{font-size:12px;color:var(--muted);display:block;margin-top:5px;font-weight:500}
.section{margin:22px 0 10px;font-weight:700;color:#cfeaff}.msg{margin-top:12px;color:var(--muted);min-height:22px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #24425e;background:#081827;color:white;font-size:16px;margin-top:8px}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;min-height:52px;padding:12px}.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>💻 Eme PC Remote</h1>
<div class="sub">iPhoneからPCを操作 <span id="ver"></span></div>

<div class="status">
  <span id="dot" class="dot"></span>
  <div><strong id="statusText">接続確認中…</strong><div class="small" id="detail">PCへ接続しています</div></div>
</div>

<div class="grid">
  <button id="wake" class="full" disabled>⚡ PCを起動<span class="small">GS-BE7200X導入後に有効化</span></button>
  <button data-action="lock">🔒 ロック</button>
  <button data-action="restart">🔄 再起動</button>
  <button data-action="shutdown" class="danger full">⏻ シャットダウン</button>
</div>

<div class="section">アプリ</div>
<div id="apps" class="apps"></div>

<div class="section">アップデート</div>
<div class="panel">
  <div id="updateState">更新設定を読み込み中…</div>
  <div id="repoSetup">
    <input id="repo" placeholder="GitHub: owner/repo">
    <div class="row"><button id="saveRepo">更新元を保存</button></div>
  </div>
  <div class="row">
    <button id="checkUpdate">更新を確認</button>
    <button id="installUpdate" class="hidden">アップデート</button>
  </div>
  <div id="updateMsg" class="msg"></div>
</div>

<div id="msg" class="msg"></div>
</main>

<script>
const qs=new URLSearchParams(location.search);
let token=qs.get("token")||localStorage.getItem("emeRemoteToken")||"";
if(token)localStorage.setItem("emeRemoteToken",token);
const auth=(p)=>p+(p.includes("?")?"&":"?")+"token="+encodeURIComponent(token);
const msg=document.getElementById("msg");
const updateMsg=document.getElementById("updateMsg");

async function status(){
  try{
    const r=await fetch(auth("/api/status"),{cache:"no-store"});
    if(!r.ok)throw new Error("接続できません");
    const d=await r.json();
    document.getElementById("dot").className="dot on";
    document.getElementById("statusText").textContent=d.name+"：オンライン";
    document.getElementById("detail").textContent=d.ip+" / "+d.hostname;
    document.getElementById("ver").textContent="v"+d.version;
    document.getElementById("repo").value=d.update_repo||"";
    document.getElementById("updateState").textContent=d.update_repo ? "更新元："+d.update_repo : "更新元GitHubはまだ未設定です。";

    const apps=document.getElementById("apps");
    apps.innerHTML="";
    (d.apps||[]).forEach(name=>{
      const b=document.createElement("button");
      b.textContent="▶ "+name;
      b.addEventListener("click",()=>action("launch",name));
      apps.appendChild(b);
    });
  }catch(e){
    document.getElementById("dot").className="dot";
    document.getElementById("statusText").textContent="PC：オフライン";
    document.getElementById("detail").textContent=e.message;
  }
}

async function action(actionName,appName){
  if((actionName==="shutdown"||actionName==="restart")&&!confirm(actionName==="shutdown"?"PCをシャットダウンする？":"PCを再起動する？"))return;
  msg.textContent="送信中…";
  try{
    const r=await fetch("/api/action",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token,action:actionName,app:appName||""})
    });
    const d=await r.json();
    if(!r.ok)throw new Error(d.message||d.error||"失敗");
    msg.textContent="✓ 実行しました";
  }catch(e){msg.textContent="⚠ "+e.message}
}

async function saveRepo(){
  const repo=document.getElementById("repo").value.trim();
  const r=await fetch("/api/update/config",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({token,repo,branch:"main"})
  });
  const d=await r.json();
  if(!r.ok){updateMsg.textContent="⚠ "+(d.error||"保存失敗");return}
  updateMsg.textContent="✓ 更新元を保存しました";
  status();
}

async function checkUpdate(){
  updateMsg.textContent="確認中…";
  document.getElementById("installUpdate").classList.add("hidden");
  try{
    const r=await fetch(auth("/api/update/check"),{cache:"no-store"});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"確認失敗");
    if(d.available){
      document.getElementById("updateState").textContent=`新しいバージョン ${d.latest} があります`;
      document.getElementById("installUpdate").classList.remove("hidden");
      updateMsg.textContent=d.notes||"アップデートできます。";
    }else{
      document.getElementById("updateState").textContent=`最新版です（v${d.current}）`;
      updateMsg.textContent="";
    }
  }catch(e){
    updateMsg.textContent="⚠ "+e.message;
  }
}

async function installUpdate(){
  if(!confirm("Eme PC Remoteをアップデートする？\n数秒間だけ接続が切れて自動再起動します。"))return;
  updateMsg.textContent="アップデート準備中…";
  try{
    const r=await fetch("/api/update/install",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token})
    });
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"更新失敗");
    if(d.already_latest){updateMsg.textContent="すでに最新版です。";return}
    updateMsg.textContent=`v${d.version}へ更新中… 自動で戻ります。`;
    setTimeout(()=>location.reload(),7000);
  }catch(e){updateMsg.textContent="⚠ "+e.message}
}

document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>action(b.dataset.action)));
document.getElementById("saveRepo").addEventListener("click",saveRepo);
document.getElementById("checkUpdate").addEventListener("click",checkUpdate);
document.getElementById("installUpdate").addEventListener("click",installUpdate);

status();
setInterval(status,5000);
</script>
</body>
</html>
